# Netlify build config for the Putty demo (a Vite app).
#
# `vite build` bundles the page (incl. the opentype.js ESM import) into
# dist/, but it can't bundle the classic `<script src="lib/putty.js">` tag,
# so the build script copies lib/ into dist/lib afterwards — otherwise the
# deployed page 404s on the library. See package.json "build".
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
